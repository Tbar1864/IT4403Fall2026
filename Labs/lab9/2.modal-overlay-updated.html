<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Details UI: Modal Page - Open Library</title>

    <script type="text/javascript" src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/2.3.0/mustache.min.js"></script>

    <script id="booklisttemplate" type="text/template">
        {{#books}}
        <div class="booklistitem" data-key="{{key}}">
            <img src="{{coverSmall}}" width="50" height="75" /> {{title}}
        </div>
        {{/books}}
    </script>

    <script id="bookdetailstemplate" type="text/template">
        <div><input type="button" id="btnHide" value="Close This" /></div>
        <div class="book">
            <h2>{{title}}</h2>
            <img src="{{coverLarge}}" style="float: left; margin-right: 15px;" />
            <div style="margin-left: 220px">
                <br> By {{author}} - {{year}}
                <h4>Description</h4>
                <div>{{description}}</div>
                <p><a href="{{link}}" target="_blank">More Information on Open Library</a></p>
            </div>
            <div style="clear: both"></div>
        </div>
    </script>

    <script type="text/javascript">
    var currentBooks = [];

    $(document).ready(function ()
    {
        $("#btnSearch").click(function ()
        {
            var term = $("#searchTerm").val().trim();

            if (term === "")
            {
                $("#booklist").html("<p>Please enter a search term.</p>");
                return;
            }

            searchBooks(term);
        });
    });

    function normalizeBooks(docs, max)
    {
        return docs.slice(0, max).map(function(book)
        {
            return {
                key: book.key || "",
                title: book.title || "No title",
                author: (book.author_name && book.author_name.length > 0)
                    ? book.author_name[0]
                    : "Unknown author",
                year: book.first_publish_year || "N/A",
                description: "Description not available in search results.",
                coverSmall: book.cover_i
                    ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-S.jpg"
                    : "https://placehold.co/50x75?text=No+Image",
                coverLarge: book.cover_i
                    ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg"
                    : "https://placehold.co/180x260?text=No+Image",
                link: book.key
                    ? "https://openlibrary.org" + book.key
                    : "https://openlibrary.org"
            };
        });
    }

    function searchBooks(term)
    {
        $("#booklist").html("<p>Searching...</p>");
        $("#bookdetails").hide().html("");

        var serviceUrl = "https://openlibrary.org/search.json?q=" + encodeURIComponent(term);

        $.ajax({
            url: serviceUrl,
            method: "GET",
            dataType: "json",
            success: function (searchResultsJson)
            {
                currentBooks = normalizeBooks(searchResultsJson.docs || [], 12);

                if (currentBooks.length === 0)
                {
                    $("#booklist").html("<p>No results found.</p>");
                    return;
                }

                var template = $("#booklisttemplate").html();
                var html = Mustache.render(template, { books: currentBooks });
                $("#booklist").html(html);

                $(".booklistitem").on("click", function ()
                {
                    var bookKey = $(this).attr("data-key");
                    getBookDetails(bookKey);
                });
            },
            error: function ()
            {
                $("#booklist").html("<p>Error loading data.</p>");
            }
        });
    }

    function getBookDetails(bookKey)
    {
        var selectedBook = currentBooks.find(function(book)
        {
            return book.key === bookKey;
        });

        if (selectedBook)
        {
            var template = $("#bookdetailstemplate").html();
            var html = Mustache.render(template, selectedBook);
            $("#bookdetails").html(html).fadeIn();

            $("#btnHide").on("click", function ()
            {
                $("#bookdetails").fadeOut();
            });
        }
    }
    </script>

    <style>
        body
        {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        #header
        {
            background-color: #66ddee;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 5px;
            z-index: 1000;
        }

        #maincontent
        {
            margin-top: 140px;
            padding: 10px;
        }

        #booklist
        {
            display: flex;
            flex-wrap: wrap;
        }

        .booklistitem
        {
            border: thin solid gray;
            cursor: pointer;
            margin: 1px;
            width: 32%;
            padding: 6px;
            background: white;
            box-sizing: border-box;
        }

        .booklistitem:hover
        {
            background-color: yellow;
        }

        #bookdetails
        {
            position: fixed;
            top: 50px;
            left: 120px;
            overflow: auto;
            width: 80%;
            height: 80%;
            background-color: #DDEEFF;
            padding: 10px;
            display: none;
            box-shadow: 0px 0px 20px 20px #bbbbbb;
            outline: 500px solid rgba(0,0,0,0.5);
            z-index: 2000;
        }

        .description-box
        {
            margin: 10px 0 15px 0;
            padding: 10px 12px;
            background-color: #f4f8fb;
            border-left: 5px solid #4a90e2;
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }
    </style>
</head>

<div id="header">
    <div class="description-box">
        <strong>About this demo:</strong> This page demonstrates a modal overlay pattern where clicking a book opens its details in a popup panel above the main page.
    </div>

    <h1>Book Search</h1>
    <input type="text" id="searchTerm" value="javascript" />
    <input type="button" id="btnSearch" value="Search" />
</div>

<div id="maincontent">
    <div id="booklist"></div>
</div>

<div id="bookdetails"></div>

</html>
