<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 3 Exercise 4: Nested JSON Data</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f7fb; color: #18212b; line-height: 1.6; }
    main { width: min(900px, 92%); margin: 2rem auto; padding: 2rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; }
    h1, h2, h3 { color: #12355b; } #output { padding: 1rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 7px; }
    .label { font-weight: bold; color: #12355b; } li { margin-bottom: .5rem; }
    .back { display: inline-block; margin-top: 1rem; padding: .65rem 1rem; background: #12355b; color: #fff; text-decoration: none; border-radius: 5px; }
    .back:hover { background: #1f6aa5; }
  </style>
</head>
<body>
  <main>
    <h1>Lab 3: JSON</h1>
    <h2>Exercise 4: Work with Nested JSON Data</h2>
    <p>This student object contains simple student information and a nested array of course objects. A loop processes and displays each course.</p>
    <div id="output"></div>
    <a class="back" href="../lab-work.html">Back to Labs</a>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const student = {
      name: "Jordan Taylor",
      major: "Information Technology",
      email: "jordan.taylor@example.com",
      courses: [
        { code: "IT 3203", title: "Advanced Web Development", credits: 3 },
        { code: "IT 4213", title: "Mobile Application Development", credits: 3 },
        { code: "IT 3123", title: "Systems Analysis and Design", credits: 3 }
      ]
    };

    $(function () {
      let html = `<p><span class="label">Student name:</span> ${student.name}<br>`;
      html += `<span class="label">Major:</span> ${student.major}<br>`;
      html += `<span class="label">Email:</span> ${student.email}</p>`;
      html += "<h3>Courses</h3><ul>";
      student.courses.forEach(function (course) {
        html += `<li><span class="label">${course.code}</span>: ${course.title} (${course.credits} credit hours)</li>`;
      });
      html += "</ul>";
      $("#output").html(html);
    });
  </script>
</body>
</html>
