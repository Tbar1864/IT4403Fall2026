<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 3 Exercise 6: Movie Information</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f7fb; color: #18212b; line-height: 1.6; }
    main { width: min(900px, 92%); margin: 2rem auto; padding: 2rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; }
    h1, h2, h3 { color: #12355b; } #output { padding: 1rem; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 7px; }
    .label { font-weight: bold; color: #12355b; } .poster { width: min(220px, 100%); height: auto; border: 1px solid #cbd5e1; border-radius: 7px; } li { margin-bottom: .5rem; }
    .back { display: inline-block; margin-top: 1rem; padding: .65rem 1rem; background: #12355b; color: #fff; text-decoration: none; border-radius: 5px; }
    .back:hover { background: #1f6aa5; }
  </style>
</head>
<body>
  <main>
    <h1>Lab 3: JSON</h1>
    <h2>Exercise 6: Movie Information Page</h2>
    <p>This page retrieves the professor-provided <code>movie.json</code> file. It accesses nested objects and loops through the genres and cast arrays to organize the movie information.</p>
    <div id="output" aria-live="polite">Loading movie information...</div>
    <a class="back" href="../lab-work.html">Back to Labs</a>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $.getJSON("movie.json")
        .done(function (data) {
          const genres = data.genres.join(", ");
          let cast = "";
          data.abridged_cast.forEach(function (actor) {
            cast += `<li><span class="label">${actor.name}</span> as ${actor.characters.join(", ")}</li>`;
          });
          const html = `<h3>${data.title} (${data.year})</h3>
            <img class="poster" src="${data.posters.profile}" alt="Poster for ${data.title}">
            <p><span class="label">MPAA rating:</span> ${data.mpaa_rating}<br>
            <span class="label">Runtime:</span> ${data.runtime} minutes<br>
            <span class="label">Genres:</span> ${genres}<br>
            <span class="label">Studio:</span> ${data.studio}<br>
            <span class="label">Theater release:</span> ${data.release_dates.theater}<br>
            <span class="label">DVD release:</span> ${data.release_dates.dvd}<br>
            <span class="label">Critics rating:</span> ${data.ratings.critics_rating} (${data.ratings.critics_score}%)<br>
            <span class="label">Audience rating:</span> ${data.ratings.audience_rating} (${data.ratings.audience_score}%)</p>
            <p><span class="label">Critics consensus:</span> ${data.critics_consensus}</p>
            <p><span class="label">Synopsis:</span> ${data.synopsis}</p>
            <h3>Cast</h3><ul>${cast}</ul>`;
          $("#output").html(html);
        })
        .fail(function () {
          $("#output").html("<p><strong>Unable to load movie.json.</strong> Confirm that movie.json is in the same lab3 folder as this HTML page and view the page through your published website.</p>");
        });
    });
  </script>
</body>
</html>
