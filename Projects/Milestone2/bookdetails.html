<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details Page</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background-color: #f3f6f8;
      }

      header {
        background-color: #1d4e89;
        color: #ffffff;
        padding: 2.5rem 1rem;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2rem;
      }

      header p {
        margin: 0.5rem 0 0;
      }

      nav {
        background-color: #163b67;
        text-align: center;
        padding: 0.75rem;
      }

      nav a {
        color: #ffffff;
        font-weight: bold;
        margin: 0 0.8rem;
        text-decoration: none;
      }

      nav a:hover,
      nav a:focus {
        text-decoration: underline;
      }

      main {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .intro {
        padding: 1.25rem;
        margin-bottom: 1.5rem;
        background-color: #ffffff;
        border-left: 5px solid #1d4e89;
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .status-message,
      .error-message {
        padding: 1rem;
        border-radius: 6px;
        font-weight: bold;
      }

      .status-message {
        background-color: #e0f2fe;
        color: #075985;
      }

      .error-message {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .book-card {
        display: flex;
        flex-direction: column;
        padding: 1.25rem;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      }

      .cover-container {
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        background-color: #f3f4f6;
        border-radius: 5px;
      }

      .cover-image {
        max-width: 100%;
        max-height: 280px;
        border-radius: 4px;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.2);
      }

      .no-cover {
        padding: 1rem;
        color: #4b5563;
        text-align: center;
      }

      .book-card h2 {
        margin: 0 0 0.5rem;
        color: #1d4e89;
        font-size: 1.3rem;
      }

      .details {
        margin: 0;
      }

      .details dt {
        margin-top: 0.85rem;
        color: #1d4e89;
        font-weight: bold;
      }

      .details dd {
        margin: 0.15rem 0 0;
      }

      .book-link {
        display: inline-block;
        margin-top: auto;
        padding-top: 1.25rem;
        color: #1d4e89;
        font-weight: bold;
      }

      .book-link:hover,
      .book-link:focus {
        color: #12365f;
      }

      footer {
        margin-top: 2rem;
        padding: 1rem;
        color: #ffffff;
        background-color: #163b67;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Book Details Page</h1>
      <p>Individual Project Milestone 2</p>
    </header>

    <nav aria-label="Primary navigation">
      <a href="milestone2-booksearchhome.html">Home</a>
      <a href="Bookshelfpage.html">My Bookshelf</a>
    </nav>

    <main>
      <section aria-labelledby="details-heading">
        <h2 id="details-heading">Book Details</h2>

        <p id="details-message" aria-live="polite"></p>

        <div id="book-details"></div>
      </section>
    </main>

    <footer>
      <p>Individual Project Milestone 2 |Book Details Page</p>
    </footer>

    <script>
      const parameters = new URLSearchParams(window.location.search);
      const workId = parameters.get("workId");

      const detailsMessage = document.getElementById("details-message");
      const detailsContainer = document.getElementById("book-details");

      async function loadBookDetails() {
        if (!workId) {
          detailsMessage.textContent =
            "No book selected. Return to Home and click a book title.";
          return;
        }

        detailsMessage.textContent = "Loading book details...";

        try {
          const response = await fetch(
            "https://openlibrary.org/works/" +
              encodeURIComponent(workId) +
              ".json",
          );

          if (!response.ok) {
            throw new Error("Request failed: " + response.status);
          }

          const book = await response.json();

          const title = document.createElement("h3");
          title.textContent = book.title || "Untitled book";
          detailsContainer.appendChild(title);

          const idParagraph = document.createElement("p");
          idParagraph.textContent = "Work ID: " + workId;
          detailsContainer.appendChild(idParagraph);

          const coverId = book.covers?.find((id) => id > 0);

          if (coverId) {
            const cover = document.createElement("img");

            cover.src = `https://covers.openlibrary.org/b/id/${coverId}-M.jpg?default=false`;
            cover.alt = "Cover of " + (book.title || "selected book");
            cover.className = "cover-image";

            cover.addEventListener("error", function () {
              cover.replaceWith(document.createTextNode("No cover available"));
            });

            detailsContainer.appendChild(cover);
          } else {
            const fallback = document.createElement("p");
            fallback.textContent = "No cover available.";
            detailsContainer.appendChild(fallback);
          }

          const descriptionHeading = document.createElement("h3");
          descriptionHeading.textContent = "Description";
          detailsContainer.appendChild(descriptionHeading);

          const description = document.createElement("p");
          description.textContent =
            typeof book.description === "string"
              ? book.description
              : book.description?.value || "No description available.";

          detailsContainer.appendChild(description);

          const subjectsHeading = document.createElement("h3");
          subjectsHeading.textContent = "Subjects";
          detailsContainer.appendChild(subjectsHeading);

          if (book.subjects && book.subjects.length > 0) {
            const subjectsList = document.createElement("ul");

            book.subjects.slice(0, 10).forEach((subject) => {
              const item = document.createElement("li");
              item.textContent = subject;
              subjectsList.appendChild(item);
            });

            detailsContainer.appendChild(subjectsList);
          } else {
            const fallback = document.createElement("p");
            fallback.textContent = "No subjects available.";
            detailsContainer.appendChild(fallback);
          }

          const linkParagraph = document.createElement("p");
          const libraryLink = document.createElement("a");

          libraryLink.href =
            "https://openlibrary.org/works/" + encodeURIComponent(workId);
          libraryLink.textContent = "View this book on Open Library";

          linkParagraph.appendChild(libraryLink);
          detailsContainer.appendChild(linkParagraph);

          detailsMessage.textContent = "";
        } catch (error) {
          console.error("Error loading book details:", error);
          detailsMessage.textContent =
            "Unable to load this book. Please try again.";
        }
      }

      loadBookDetails();
    </script>
  </body>
</html>
