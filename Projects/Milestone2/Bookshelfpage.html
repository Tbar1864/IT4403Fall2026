<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookshelf</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background-color: #f3f6f8;
      }

      header {
        background-color: #1d4e89;
        color: #ffffff;
        padding: 2.5rem 1rem;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2rem;
      }

      header p {
        margin: 0.5rem 0 0;
      }

      nav {
        background-color: #163b67;
        text-align: center;
        padding: 0.75rem;
      }

      nav a {
        color: #ffffff;
        font-weight: bold;
        margin: 0 0.8rem;
        text-decoration: none;
      }

      nav a:hover,
      nav a:focus {
        text-decoration: underline;
      }

      main {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .intro {
        padding: 1.25rem;
        margin-bottom: 1.5rem;
        background-color: #ffffff;
        border-left: 5px solid #1d4e89;
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .status-message,
      .error-message {
        padding: 1rem;
        border-radius: 6px;
        font-weight: bold;
      }

      .status-message {
        background-color: #e0f2fe;
        color: #075985;
      }

      .error-message {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .book-card {
        display: flex;
        flex-direction: column;
        padding: 1.25rem;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      }

      .cover-container {
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        background-color: #f3f4f6;
        border-radius: 5px;
      }

      .cover-image {
        max-width: 100%;
        max-height: 280px;
        border-radius: 4px;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.2);
      }

      .no-cover {
        padding: 1rem;
        color: #4b5563;
        text-align: center;
      }

      .book-card h2 {
        margin: 0 0 0.5rem;
        color: #1d4e89;
        font-size: 1.3rem;
      }

      .details {
        margin: 0;
      }

      .details dt {
        margin-top: 0.85rem;
        color: #1d4e89;
        font-weight: bold;
      }

      .details dd {
        margin: 0.15rem 0 0;
      }

      .book-link {
        display: inline-block;
        margin-top: auto;
        padding-top: 1.25rem;
        color: #1d4e89;
        font-weight: bold;
      }

      .book-link:hover,
      .book-link:focus {
        color: #12365f;
      }

      footer {
        margin-top: 2rem;
        padding: 1rem;
        color: #ffffff;
        background-color: #163b67;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Book Shelf Page</h1>
      <p>Individual Project Milestone 2</p>
    </header>

    <nav aria-label="Primary navigation">
      <a href="milestone2-booksearchhome.html">Home</a>
      <a href="Bookshelfpage.html">My Bookshelf</a>
    </nav>

    <main>
      <section aria-labelledby="bookshelf-heading">
        <h2 id="bookshelf-heading">My Selected Books</h2>

        <div class="intro">
          <p>
            A personal collection of books selected from Open Library. Select a
            title to view more information.
          </p>
        </div>

        <p id="bookshelf-message" aria-live="polite"></p>

        <div id="bookshelf-list" class="results-grid"></div>
      </section>
    </main>

    <footer>
      <p>Individual Project Milestone 2 | My Bookshelf</p>
    </footer>

    <script>
      // my selected work IDs for the bookshelf
      const selectedWorkIds = [
        "OL23166W",
        "OL2003035W",
        "OL111900W",
        "OL468431W",
        "OL2918756W",
      ];

      const bookshelfList = document.getElementById("bookshelf-list");
      const bookshelfMessage = document.getElementById("bookshelf-message");

      async function loadBookshelf() {
        bookshelfList.replaceChildren();
        bookshelfMessage.textContent = "Loading your bookshelf...";

        let loadedBooks = 0;

        for (const workId of selectedWorkIds) {
          try {
            const apiUrl =
              "https://openlibrary.org/works/" +
              encodeURIComponent(workId) +
              ".json";

            const response = await fetch(apiUrl);

            if (!response.ok) {
              throw new Error("Request failed: " + response.status);
            }

            const book = await response.json();

            const bookCard = document.createElement("article");
            bookCard.className = "book-card";

            const coverContainer = document.createElement("div");
            coverContainer.className = "cover-container";

            const coverId = book.covers?.find((id) => id > 0);

            if (coverId) {
              const cover = document.createElement("img");

              cover.src =
                "https://covers.openlibrary.org/b/id/" +
                coverId +
                "-S.jpg?default=false";

              cover.alt = "Cover of " + (book.title || "selected book");
              cover.className = "cover-image";

              cover.addEventListener("error", function () {
                const fallback = document.createElement("p");
                fallback.className = "no-cover";
                fallback.textContent = "No cover available.";

                cover.replaceWith(fallback);
              });

              coverContainer.appendChild(cover);
            } else {
              const fallback = document.createElement("p");
              fallback.className = "no-cover";
              fallback.textContent = "No cover available.";

              coverContainer.appendChild(fallback);
            }

            const titleHeading = document.createElement("h3");
            const titleLink = document.createElement("a");

            titleLink.href =
              "bookdetails.html?workId=" + encodeURIComponent(workId);

            titleLink.textContent = book.title || "Untitled book";

            titleHeading.appendChild(titleLink);

            bookCard.appendChild(coverContainer);
            bookCard.appendChild(titleHeading);

            bookshelfList.appendChild(bookCard);
            loadedBooks++;
          } catch (error) {
            console.error("Error loading " + workId + ":", error);

            const errorMessage = document.createElement("p");
            errorMessage.className = "error-message";
            errorMessage.textContent =
              "Unable to load book " + workId + ". Please try again later.";

            bookshelfList.appendChild(errorMessage);
          }
        }

        bookshelfMessage.textContent =
          "Loaded " +
          loadedBooks +
          " of " +
          selectedWorkIds.length +
          " selected books.";
      }

      loadBookshelf();
    </script>
  </body>
</html>
